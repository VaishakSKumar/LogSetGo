name: Deploy web app

# Every push to main type-checks, runs the tests, builds the installable web app,
# and publishes it to GitHub Pages: https://<user>.github.io/<repo>/
#
# One-time setup in the repo: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run qa:types

      - name: Unit tests
        run: npm run qa:unit

      - name: UI (integration) tests
        run: npm run qa:ui

      - name: Build web app
        run: npm run build:web
        env:
          # Pages serves the site under /<repo>/, so the app needs that base path.
          EXPO_BASE_URL: ${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
